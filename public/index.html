<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kemp Online — Real-Time Partnership Card Game for Google Meet</title>
    <meta
      name="description"
      content="Play Kemp (Kemps) online in real time alongside Google Meet. Secret between-round partner huddles, simultaneous 4-card center swaps, and KEMP / NOT KEMP showdowns."
    />

    <!-- Google Fonts: Fraunces, Plus Jakarta Sans, JetBrains Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500..600,0..1,0"
      rel="stylesheet"
    />

    <!-- Official Google Meet Add-ons SDK (gstatic) for optional inside-Meet Main Stage / Side Panel embedding -->
    <script
      src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"
      defer
    ></script>

    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="app-shell">
      <header id="topbar-root" class="topbar"></header>
      <main id="stage-root" class="main-stage"></main>
    </div>

    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-container" aria-live="polite"></div>

    <script src="./js/vendor/peerjs.min.js" defer></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
